name: Build SARVA-SHIELD Android APK

on:
  push:
    branches: [ "*" ]
  pull_request:
  workflow_dispatch:

jobs:
  build-android-apk:
    name: Compile Release APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter Stable
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Locate Project Root, Clean Lockfiles & Fetch Packages
        run: |
          PUBSPEC_FILE=$(find . -maxdepth 3 -name "pubspec.yaml" | head -n 1)
          if [ -z "$PUBSPEC_FILE" ]; then
            echo "Error: pubspec.yaml not found in repository!"
            exit 1
          fi
          PROJECT_DIR=$(dirname "$PUBSPEC_FILE")
          echo "PROJECT_DIR=$PROJECT_DIR" >> $GITHUB_ENV
          cd "$PROJECT_DIR"
          rm -f pubspec.lock android/local.properties .flutter-plugins-dependencies
          sed -i 's/\r$//' android/gradlew
          chmod +x android/gradlew
          flutter pub get

      - name: Patch flutter_bluetooth_serial for Gradle 8.14 & AGP 8+
        run: |
          python3 - << 'EOF'
          import glob, os, re

          pub_cache = os.path.expanduser("~/.pub-cache")
          clean_bg = "\n".join([
              "group = 'io.github.edufolly.flutterbluetoothserial'",
              "version = '1.0-SNAPSHOT'",
              "buildscript {",
              "    repositories { google(); mavenCentral() }",
              "    dependencies { classpath 'com.android.tools.build:gradle:8.11.1' }",
              "}",
              "rootProject.allprojects {",
              "    repositories { google(); mavenCentral() }",
              "}",
              "apply plugin: 'com.android.library'",
              "android {",
              "    namespace = 'io.github.edufolly.flutterbluetoothserial'",
              "    compileSdk = 36",
              "    compileOptions {",
              "        sourceCompatibility = JavaVersion.VERSION_17",
              "        targetCompatibility = JavaVersion.VERSION_17",
              "    }",
              "    defaultConfig { minSdk = 21 }",
              "}",
          ]) + "\n"

          for bg in glob.glob(f"{pub_cache}/**/flutter_bluetooth_serial*/android/build.gradle", recursive=True):
              with open(bg, "w", encoding="utf-8") as f:
                  f.write(clean_bg)
              print("Patched build.gradle:", bg)

          for mf in glob.glob(f"{pub_cache}/**/flutter_bluetooth_serial*/android/src/main/AndroidManifest.xml", recursive=True):
              with open(mf, "r", encoding="utf-8") as f:
                  mtxt = f.read()
              mtxt = re.sub(r'\s*package\s*=\s*["\'][^"\']+["\']', '', mtxt)
              with open(mf, "w", encoding="utf-8") as f:
                  f.write(mtxt)
              print("Patched AndroidManifest.xml:", mf)
          EOF

      - name: Build Release APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: flutter build apk --release --no-tree-shake-icons

      - name: Upload SARVA-SHIELD Release APK
        uses: actions/upload-artifact@v4
        with:
          name: SARVA-SHIELD-v5-Release-APK
          path: ${{ env.PROJECT_DIR }}/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
