name: Build SARVA-SHIELD APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Prepare Android Project & Build APK
        run: |
          # Subfolder locate karo jahan pubspec.yaml hai
          PUB_FILE=$(find . -name "pubspec.yaml" | head -n 1)
          PROJECT_DIR=$(dirname "$PUB_FILE")
          cd "$PROJECT_DIR"

          # Purana corrupt build hatao
          rm -rf build .dart_tool android

          # Backup main.dart aur pubspec.yaml
          cp pubspec.yaml /tmp/pubspec.yaml
          cp -r lib /tmp/lib

          # Fresh Android platform files generate karo
          flutter create --platforms=android --project-name sarva_shield_app .

          # Original files wapas dalo
          cp /tmp/pubspec.yaml pubspec.yaml
          rm -rf lib && cp -r /tmp/lib lib

          # --- FIX: minSdk ko 21 se badha kar 23 karna hai ---
          BUILD_GRADLE="android/app/build.gradle.kts"
          if [ -f "$BUILD_GRADLE" ]; then
            sed -i 's/minSdk = 21/minSdk = 23/g' "$BUILD_GRADLE"
            sed -i 's/minSdk 21/minSdk 23/g' "$BUILD_GRADLE"
          else
            BUILD_GRADLE_OG="android/app/build.gradle"
            sed -i 's/minSdkVersion 21/minSdkVersion 23/g' "$BUILD_GRADLE_OG"
            sed -i 's/minSdk = 21/minSdk = 23/g' "$BUILD_GRADLE_OG"
          fi

          # AndroidManifest mein Bluetooth aur Location permissions jodo
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          sed -i '/<manifest/a \
          <uses-permission android:name="android.permission.INTERNET" />\
          <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />\
          <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />\
          <uses-permission android:name="android.permission.BLUETOOTH" android:maxSdkVersion="30" />\
          <uses-permission android:name="android.permission.BLUETOOTH_ADMIN" android:maxSdkVersion="30" />\
          <uses-permission android:name="android.permission.BLUETOOTH_CONNECT" />\
          <uses-permission android:name="android.permission.BLUETOOTH_SCAN" />\
          <uses-permission android:name="android.permission.CALL_PHONE" />' "$MANIFEST"

          # Dependencies download karo
          flutter pub get

          # flutter_bluetooth_serial ka namespace error auto-fix karo
          find "$HOME/.pub-cache" -name "build.gradle" | grep "flutter_bluetooth_serial" | while read -r line; do
            sed -i "/android {/a \    namespace 'io.github.edufolly.flutterbluetoothserial'" "$line"
            sed -i "s/compileSdkVersion .*/compileSdkVersion 34/g" "$line"
          done

          # Final Release APK Build karo
          flutter build apk --release

          # APK ko bahar root folder mein copy karo upload ke liye
          cp build/app/outputs/flutter-apk/app-release.apk "$GITHUB_WORKSPACE/SARVA-SHIELD-v5.apk"

      - name: Upload Ready APK
        uses: actions/upload-artifact@v4
        with:
          name: SARVA-SHIELD-v5-APK
          path: SARVA-SHIELD-v5.apk
