name: Build SARVA-SHIELD Android APK

on:
  push:
    branches: [ "*" ]
  workflow_dispatch:

jobs:
  build-android-apk:
    name: Compile Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Flutter Stable
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Prepare Project & Fetch Packages
        run: |
          PUBSPEC_FILE=$(find . -maxdepth 3 -name "pubspec.yaml" | head -n 1)
          if [ -z "$PUBSPEC_FILE" ]; then
            echo "Error: pubspec.yaml not found!"
            exit 1
          fi
          PROJECT_DIR=$(dirname "$PUBSPEC_FILE")
          echo "PROJECT_DIR=$PROJECT_DIR" >> $GITHUB_ENV
          cd "$PROJECT_DIR"

          rm -f pubspec.lock android/local.properties .flutter-plugins-dependencies
          sed -i 's/\r$//' android/gradlew
          chmod +x android/gradlew
          flutter pub get

      - name: Permanent Fix for MinSdk 23, Manifest Merger & Bluetooth Serial
        run: |
          python3 - << 'EOF'
          import os, glob, re

          # 1. Force minSdk = 23 in all gradle files
          for gf in glob.glob("**/build.gradle*", recursive=True):
              with open(gf, "r", encoding="utf-8") as f:
                  content = f.read()
              content = re.sub(r'minSdk\s*=\s*[0-9]+', 'minSdk = 23', content)
              content = re.sub(r'minSdkVersion\s+[0-9]+', 'minSdkVersion 23', content)
              content = re.sub(r'minSdk\s*=\s*flutter\.minSdkVersion', 'minSdk = 23', content)
              content = re.sub(r'minSdkVersion\s+flutter\.minSdkVersion', 'minSdkVersion 23', content)
              with open(gf, "w", encoding="utf-8") as f:
                  f.write(content)
              print("Patched MinSdk in:", gf)

          # 2. Add overrideLibrary and minSdkVersion directly in AndroidManifest.xml
          for mf in glob.glob("**/src/main/AndroidManifest.xml", recursive=True):
              with open(mf, "r", encoding="utf-8") as f:
                  m = f.read()
              if 'xmlns:tools="http://schemas.android.com/tools"' not in m:
                  m = m.replace('<manifest ', '<manifest xmlns:tools="http://schemas.android.com/tools" ')
              override_tag = '<uses-sdk android:minSdkVersion="23" tools:overrideLibrary="androidx.datastore.preferences.core, androidx.datastore.core" />'
              if '<uses-sdk' in m:
                  m = re.sub(r'<uses-sdk[^>]*/>', override_tag, m)
              else:
                  m = re.sub(r'(<manifest[^>]*>)', r'\1\n    ' + override_tag, m)
              with open(mf, "w", encoding="utf-8") as f:
                  f.write(m)
              print("Patched Manifest with overrideLibrary:", mf)

          # 3. Patch flutter_bluetooth_serial namespace without deleting plugin dependencies
          pub_cache = os.path.expanduser("~/.pub-cache")
          for bg in glob.glob(f"{pub_cache}/**/flutter_bluetooth_serial*/android/build.gradle", recursive=True):
              with open(bg, "r", encoding="utf-8") as f:
                  bgtxt = f.read()
              if "namespace" not in bgtxt:
                  bgtxt = bgtxt.replace("android {", "android {\n    namespace 'io.github.edufolly.flutterbluetoothserial'")
              bgtxt = re.sub(r'compileSdkVersion\s+[0-9]+', 'compileSdkVersion 34', bgtxt)
              with open(bg, "w", encoding="utf-8") as f:
                  f.write(bgtxt)
              print("Patched flutter_bluetooth_serial:", bg)
          EOF

      - name: Build Release APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: flutter build apk --release --no-tree-shake-icons --android-skip-build-dependency-validation

      - name: Upload SARVA-SHIELD Release APK
        uses: actions/upload-artifact@v4
        with:
          name: SARVA-SHIELD-v5-Release-APK
          path: ${{ env.PROJECT_DIR }}/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
