name: Build SARVA-SHIELD Android APK

on:
  push:
    branches: [ "*" ]
  pull_request:
  workflow_dispatch:

jobs:
  build-android-apk:
    name: Compile Release APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter Stable
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Locate Project Root & Clean Cache
        run: |
          PUBSPEC_FILE=$(find . -maxdepth 3 -name "pubspec.yaml" | head -n 1)
          if [ -z "$PUBSPEC_FILE" ]; then
            echo "Error: pubspec.yaml not found!"
            exit 1
          fi
          PROJECT_DIR=$(dirname "$PUBSPEC_FILE")
          echo "PROJECT_DIR=$PROJECT_DIR" >> $GITHUB_ENV
          cd "$PROJECT_DIR"
          rm -f pubspec.lock android/local.properties .flutter-plugins-dependencies
          sed -i 's/\r$//' android/gradlew
          chmod +x android/gradlew
          
          # Fix MinSdk to 23
          find android -name "build.gradle*" | while read -r file; do
            sed -i 's/minSdk = 21/minSdk = 23/g' "$file"
            sed -i 's/minSdkVersion 21/minSdkVersion 23/g' "$file"
          done
          
          flutter pub get

      - name: Patch flutter_bluetooth_serial (Safe Namespace Injection)
        run: |
          find "$HOME/.pub-cache" -name "build.gradle" 2>/dev/null | grep "flutter_bluetooth_serial" | while read -r file; do
            echo "Patching: $file"
            if ! grep -q "namespace" "$file"; then
              sed -i "/android {/a \    namespace 'io.github.edufolly.flutterbluetoothserial'" "$file"
            fi
            sed -i "s/compileSdkVersion .*/compileSdkVersion 34/g" "$file"
          done

      - name: Build Release APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: flutter build apk --release --no-tree-shake-icons --android-skip-build-dependency-validation

      - name: Upload SARVA-SHIELD Release APK
        uses: actions/upload-artifact@v4
        with:
          name: SARVA-SHIELD-v5-Release-APK
          path: ${{ env.PROJECT_DIR }}/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
