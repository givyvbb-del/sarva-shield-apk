name: Build SARVA-SHIELD Android APK

on:
  push:
    branches: [ "*" ]
  workflow_dispatch:

jobs:
  build-android-apk:
    name: Compile Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Flutter Stable
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Hard-Overwrite build.gradle.kts & Fix Bluetooth Plugin
        run: |
          PUBSPEC_FILE=$(find . -maxdepth 3 -name "pubspec.yaml" | head -n 1)
          PROJECT_DIR=$(dirname "$PUBSPEC_FILE")
          echo "PROJECT_DIR=$PROJECT_DIR" >> $GITHUB_ENV
          cd "$PROJECT_DIR"

          rm -f pubspec.lock android/local.properties .flutter-plugins-dependencies
          sed -i 's/\r$//' android/gradlew
          chmod +x android/gradlew

          # 1. AndroidManifest.xml se uses-sdk tag hatao taaki conflict na ho
          sed -i '/<uses-sdk/d' android/app/src/main/AndroidManifest.xml

          # 2. android/app/build.gradle.kts ko seedha minSdk = 23 ke saath pura overwrite karo
          rm -f android/app/build.gradle android/app/build.gradle.kts
          cat << 'EOF' > android/app/build.gradle.kts
          plugins {
              id("com.android.application")
              id("kotlin-android")
              id("dev.flutter.flutter-gradle-plugin")
          }

          android {
              namespace = "com.example.sarva_shield_app"
              compileSdk = 35
              ndkVersion = flutter.ndkVersion

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = "17"
              }

              defaultConfig {
                  applicationId = "com.example.sarva_shield_app"
                  minSdk = 23
                  targetSdk = 35
                  versionCode = 1
                  versionName = "1.0.0"
              }

              buildTypes {
                  release {
                      signingConfig = signingConfigs.getByName("debug")
                      isMinifyEnabled = false
                      isShrinkResources = false
                  }
              }
          }

          flutter {
              source = "../.."
          }
          EOF

          # 3. Packages download karo
          flutter pub get

          # 4. Patch flutter_bluetooth_serial (Namespace + SDK 34 + Remove old package attr)
          python3 - << 'PYEOF'
          import os, glob, re
          pub_cache = os.path.expanduser("~/.pub-cache")

          for bg in glob.glob(f"{pub_cache}/**/flutter_bluetooth_serial*/android/build.gradle", recursive=True):
              with open(bg, "r", encoding="utf-8") as f:
                  txt = f.read()
              if "namespace" not in txt:
                  txt = txt.replace("android {", "android {\n    namespace 'io.github.edufolly.flutterbluetoothserial'")
              txt = re.sub(r'compileSdkVersion\s+[0-9]+', 'compileSdkVersion 34', txt)
              txt = re.sub(r'minSdkVersion\s+[0-9]+', 'minSdkVersion 23', txt)
              with open(bg, "w", encoding="utf-8") as f:
                  f.write(txt)
              print("Patched build.gradle:", bg)

          for mf in glob.glob(f"{pub_cache}/**/flutter_bluetooth_serial*/android/src/main/AndroidManifest.xml", recursive=True):
              with open(mf, "r", encoding="utf-8") as f:
                  mtxt = f.read()
              mtxt = re.sub(r'\s*package\s*=\s*["\'][^"\']+["\']', '', mtxt)
              with open(mf, "w", encoding="utf-8") as f:
                  f.write(mtxt)
              print("Cleaned package attribute in:", mf)
          PYEOF

      - name: Build Release APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: flutter build apk --release --no-tree-shake-icons --android-skip-build-dependency-validation

      - name: Upload SARVA-SHIELD Release APK
        uses: actions/upload-artifact@v4
        with:
          name: SARVA-SHIELD-v5-Release-APK
          path: ${{ env.PROJECT_DIR }}/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
